name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # release.yml runs `poetry install --no-interaction --only main`, but
  # nothing here does — CI installs from hash-pinned requirements files.
  # So a poetry.lock that no longer matches pyproject.toml stays
  # invisible until a release, and the tag is already public by then.
  # That exact gap broke a sibling package's release.
  lockfile:
    name: Lockfile matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Verify poetry.lock is current
        run: |
          if ! poetry check --lock; then
            echo "::error::poetry.lock is stale. Run 'poetry lock' and commit the result."
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-pinned install (supply-chain hardening). The local package itself
      # is imported via ``python -m pytest`` (repo root on sys.path) so no
      # unpinnable ``pip install -e .`` is required.
      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes -r requirements/test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # The benchmark asserts no timing threshold -- wall-clock is not
      # comparable between runners. This proves it still executes against the
      # current API, so it cannot rot into a file that reads as verified.
      - name: Run the benchmark
        run: python benches/bench_tool_dispatch.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml camt053_mcp

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lint tools (hash-pinned)
        run: pip install --require-hashes -r requirements/lint.txt

      - name: Ruff check
        run: ruff check camt053_mcp/ tests/ benches/

      - name: Black check
        run: black --check camt053_mcp/ tests/ benches/

      - name: Mypy
        run: mypy camt053_mcp/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install bandit (hash-pinned)
        run: pip install --require-hashes -r requirements/security.txt
      - name: Bandit
        run: bandit -r camt053_mcp/ -ll
