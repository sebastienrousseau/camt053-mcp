name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list, resources/list, prompts/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Hash-pinned throughout: the runtime set from requirements/test.txt,
      # then the package as a wheel built with the hash-pinned build backend.
      # Scorecard counts `pip install .` as unpinned, a local wheel installed
      # with --no-deps as pinned.
      - name: Install camt053-mcp (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/test.txt
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --require-hashes -r requirements/build.txt
          "$RUNNER_TEMP/build/bin/pip" wheel --no-deps --no-build-isolation --wheel-dir wheelhouse .
          pip install --no-deps wheelhouse/*.whl
          pip check

      # The Inspector is pinned to an exact release (2.10.1, 2026-10-08) so a new
      # npm publish cannot change what CI runs; raise it deliberately.
      - name: List tools via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli camt053-mcp --method tools/list

      - name: List resources via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli camt053-mcp --method resources/list

      - name: List prompts via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli camt053-mcp --method prompts/list

      - name: Serve streamable HTTP and SSE in the background
        run: |
          camt053-mcp --transport streamable-http --port 8000 &
          camt053-mcp --transport sse --port 8001 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8000/mcp \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{}' && break
            sleep 1
          done

      - name: List tools over streamable HTTP via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli http://127.0.0.1:8000/mcp --transport http --method tools/list

      - name: List tools over SSE via MCP Inspector CLI
        run: npx --yes @modelcontextprotocol/inspector@2.10.1 --cli http://127.0.0.1:8001/sse --transport sse --method tools/list
