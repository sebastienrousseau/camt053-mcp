# Every restatement of the release version agrees: pyproject, __version__,
# CHANGELOG, glama.json (what the Glama directory shows) and server.json
# (what the MCP registry publishes). Standard library only; no install.
name: Version sources agree

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_versions.py
